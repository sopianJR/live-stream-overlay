[package]
name = "livestream-overlay"
version = "0.2.0"
description = "Overlay live chat YouTube + status OBS untuk streamer satu monitor"
edition = "2021"

[lib]
# Nama berakhiran _lib untuk menghindari bentrok nama dengan binary di Windows.
name = "livestream_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
obws = { version = "0.15", features = ["events"] }
tokio = { version = "1", features = ["macros", "sync", "time"] }
futures-util = "0.3"
# Tipe durasi yang dipakai di API obws.
time = "0.3"
# InnerTube (chat YouTube). TLS bawaan Windows (SChannel) agar tidak butuh toolchain tambahan.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "gzip", "json", "form", "query", "system-proxy"] }
url = "2"
# WebSocket Trakteer (sama dengan yang dipakai obws, ditambah TLS bawaan Windows).
tokio-websockets = { version = "0.13", features = ["client", "native-tls", "fastrand", "sha1_smol"] }
# Login Google (OAuth PKCE) untuk membalas chat.
tauri-plugin-opener = "2"
getrandom = "0.3"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
# Server OBS tiruan untuk test & `cargo run --example mock_obs` (lihat tests/support/mock_obs.rs).
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-websockets = { version = "0.13", features = ["server", "sha1_smol", "fastrand"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
